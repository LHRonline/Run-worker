name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: 构建并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 打包 NSIS 安装包
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 规整安装包文件名
        shell: bash
        run: |
          # electron-builder 会把 0.0.3a 规范化成 0.0.3-a，这里改回与版本号一致的写法，
          # 避免 Release 里同时出现两个功能相同的 exe。
          shopt -s nullglob
          for f in release/*.exe; do
            base=$(basename "$f")
            new=$(echo "$base" | sed -E 's/^Run-worker-([0-9]+(\.[0-9]+)*)-([a-z]+)-setup\.exe$/Run-worker-\1\3-setup.exe/')
            if [ "$base" != "$new" ]; then
              mv "$f" "release/$new"
              echo "重命名：$base -> $new"
            fi
          done

      - name: 校验产物
        shell: bash
        run: |
          ls -lh release
          test -n "$(ls release/*.exe 2>/dev/null)" || { echo "未生成 exe"; exit 1; }

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Run worker ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
