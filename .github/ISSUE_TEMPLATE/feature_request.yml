name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。提交前建议先读一遍使用教程（[README 的 3 分钟上手](https://github.com/LHRonline/run-worker#3-分钟上手) 与 [docs/API.md](https://github.com/LHRonline/run-worker/blob/main/docs/API.md)），确认这是能力缺口而不是使用方法问题。

  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新增 Agent
        - 新增工具 / 工具能力增强
        - 新增模型渠道
        - MCP 相关
        - 定时任务与自动化
        - 知识库与记忆
        - 界面与交互
        - 安装、更新与分发
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述当前遇到的困难，而不是直接给方案
      placeholder: 例如：我有大量 PDF 需要定期摘要，现在只能手动一个个丢进对话
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的行为
      placeholder: 例如：知识库支持 PDF 批量索引，并允许定时任务引用某个知识源
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 你愿意自己实现吗
      options:
        - 愿意提 PR
        - 可以协助测试
        - 仅提出想法
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
